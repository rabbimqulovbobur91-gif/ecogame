
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO GAME BOBUR</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #052e16, #166534, #14532d);
  color: white;
  text-align: center;
}

#startScreen {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 {
  font-size: 55px;
  color: #86efac;
  text-shadow: 0 0 20px #22c55e;
}

button {
  width: 230px;
  padding: 16px;
  margin: 12px;
  border: none;
  border-radius: 30px;
  background: #22c55e;
  color: #052e16;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #86efac;
  transform: scale(1.08);
}

#gameScreen {
  display: none;
  padding: 40px;
}

</style>
</head>

<body>

<div id="startScreen">

<h1>🌍 ECO GAME</h1>
<h2>WELCOME TO ECO WORLD</h2>
<p>Protect nature. Save the planet!</p>

<button onclick="startGame()">▶ START GAME</button>
<button onclick="howToPlay()">📖 HOW TO PLAY</button>
<button onclick="toggleSound()" id="soundButton">🔊 SOUND ON</button>

</div>

<div id="gameScreen">

<h1>🌱 GAME STARTED!</h1>
<h2>Welcome to ECO WORLD!</h2>
<p>Your adventure begins now!</p>

<button onclick="backToMenu()">🏠 MAIN MENU</button>

</div>

<script>

let soundEnabled = true;

function clickSound() {
  if (!soundEnabled) return;
  const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/pop.ogg"
  );
  audio.play().catch(() => {});
}

function startGame() {
  clickSound();
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "block";
}

function backToMenu() {
  clickSound();
  document.getElementById("gameScreen").style.display = "none";
  document.getElementById("startScreen").style.display = "flex";
}

function howToPlay() {
  alert("Welcome! Protect nature and save the planet!");
  clickSound();
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById("soundButton").innerText =
    soundEnabled ? "🔊 SOUND ON" : "🔇 SOUND OFF";
}

</script>

<<script>
alert("ECO GAME BOBUR ISHLAYAPTI!");
</script>/body>
</html>
